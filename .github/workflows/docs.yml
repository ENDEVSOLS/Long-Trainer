name: Deploy Docs

on:
  workflow_dispatch:
  push:
    branches: ["master"]
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      # Reruns retain earlier artifacts; deploy only this attempt's upload.
      PAGES_ARTIFACT_NAME: github-pages-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - uses: actions/checkout@v4

      # Enable Pages with Source = GitHub Actions in repository Settings > Pages.
      # GITHUB_TOKEN cannot perform that one-time repository setup.
      - name: Check GitHub Pages configuration
        uses: actions/configure-pages@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install MkDocs and theme
        run: pip install mkdocs mkdocs-material pymdown-extensions

      - name: Build docs
        run: mkdocs build --config-file docs/mkdocs.yml --site-dir ${{ github.workspace }}/site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: ${{ env.PAGES_ARTIFACT_NAME }}
          path: ${{ github.workspace }}/site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ env.PAGES_ARTIFACT_NAME }}
