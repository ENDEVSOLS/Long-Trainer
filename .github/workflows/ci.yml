name: Python CI

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ruff
        run: pip install 'ruff>=0.9'

      - name: Check agreed lint rules
        run: ruff check .

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libmagic-dev poppler-utils tesseract-ocr

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install '.[agent,research,coding,financial,dev,cli,api]'

      - name: Prepare document parser assets
        # Some Python 3.10 dependency resolutions do not install spaCy.
        # Declare both spaCy and its compatible model; the model wheel has no dependencies.
        run: |
          python -m pip install 'spacy>=3.8,<3.9' 'https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl'
          python -c "import spacy; spacy.load('en_core_web_sm')"

      - name: Run offline tests
        run: pytest tests/ -v -ra

  integration:
    name: Lazy-loading integration (Python 3.12)
    runs-on: ubuntu-latest
    needs: lint
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping: 1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libmagic-dev poppler-utils tesseract-ocr

      - name: Install package and integration dependencies
        run: |
          python -m pip install --upgrade pip
          pip install '.[agent,dev,cli,api,integration]'

      - name: Run service-backed integration tests
        env:
          LONGTRAINER_TEST_MONGO_URI: mongodb://localhost:27017/?serverSelectionTimeoutMS=5000
        run: pytest tests/ -v -ra -m integration --run-integration
