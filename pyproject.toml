[project]
name = "longtrainer"
version = "1.4.0"
description = "Production-ready RAG framework built on LangChain — multi-tenant chatbots with streaming, tool calling, agent mode, FAISS vector search, and persistent MongoDB memory"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Endevsols", email = "technology@endevsols.com" }]
keywords = [
    "rag",
    "langchain",
    "chatbot",
    "llm",
    "openai",
    "retrieval-augmented-generation",
    "vector-database",
    "faiss",
    "multi-tenant",
    "streaming",
    "agent",
    "langgraph",
    "embeddings",
    "gpt",
    "conversational-ai",
    "document-qa",
    "mongodb",
    "ai",
    "nlp",
    "longtrainer",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: Linguistic",
    "Framework :: FastAPI",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
dependencies = [
    "langchain>=0.3.14",
    "langchain-core>=0.3.30",
    "langchain-community>=0.3.14",
    "mypy-extensions>=1.0",  # Required by the community tool loader at runtime.
    "langchain-openai>=0.3.4",
    "langchain-text-splitters>=0.3.0",
    "langchain-unstructured>=0.2.0",
    "faiss-cpu>=1.9.0",
    "pymongo>=4.10",
    "cryptography>=44.0",
    "tiktoken>=0.8",
    "duckduckgo-search>=7.0",
    "pypdf>=5.1",
    "docx2txt>=0.8",
    "python-docx>=1.1",
    "python-magic>=0.4",
    "unstructured[all-docs]>=0.18",
    "youtube-transcript-api>=1.0",
    "pytube>=15.0",
    "wikipedia>=1.4",
    "pandas>=2.2",
    "pydantic>=2.9",
    "click>=8.0",
    "pyyaml>=6.0",
    "jsonschema>=4.0",
    "Pillow>=10.0",
    "slowapi>=0.1.9",
]

[project.optional-dependencies]
cli = ["click>=8.0", "pyyaml>=6.0"]
agent = ["langgraph>=0.3.10"]
# The community ArxivAPIWrapper still calls Search.results, removed in arxiv 4.
research = ["langgraph>=0.3.10", "tavily-python>=0.5", "arxiv>=2.1,<4"]
coding = ["langgraph>=0.3.10", "tavily-python>=0.5", "langchain-experimental>=0.3.4"]
financial = ["langgraph>=0.3.10", "yfinance>=0.2.54", "langchain-experimental>=0.3.4"]
tracer = ["longtracer[langchain,langgraph,mongo]>=0.1.6"]
api = ["fastapi>=0.115", "uvicorn>=0.32"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "ruff>=0.9", "httpx>=0.27"]
integration = ["langchain-qdrant>=0.2", "qdrant-client>=1.12"]

[project.scripts]
longtrainer = "longtrainer.cli:main"

[project.urls]
Homepage = "https://github.com/ENDEVSOLS/Long-Trainer"
Documentation = "https://endevsols.github.io/Long-Trainer/"
Repository = "https://github.com/ENDEVSOLS/Long-Trainer"
Changelog = "https://github.com/ENDEVSOLS/Long-Trainer/blob/master/CHANGELOG.md"
"Bug Tracker" = "https://github.com/ENDEVSOLS/Long-Trainer/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["longtrainer"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
# Phase A: enforce correctness first. Restore I/W/E501 in the tracked lint follow-up.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# Import resolution is the assertion in these legacy smoke tests.
"tests/test_01_imports.py" = ["F401"]
"tests/test_04_bot_architecture.py" = ["F401"]
# Environment loading deliberately precedes imports; do not reorder execution.
"longtrainer/api.py" = ["E402"]
"longtrainer/bot.py" = ["F401"]
# Retain legacy module imports and call-side effects in Phase A; see docs/phase_a_ci_integrity.md.
"longtrainer/chat.py" = ["F401"]
"longtrainer/rate_limiter.py" = ["F401"]
"longtrainer/tools.py" = ["F401"]
"longtrainer/trainer.py" = ["F401", "F841"]
"longtrainer/vectorstores.py" = ["F401"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--strict-markers --strict-config"
markers = ["integration: requires MongoDB and the integration extra; enable with --run-integration"]
filterwarnings = ["error::pytest.PytestReturnNotNoneWarning"]
